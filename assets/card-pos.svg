    .gd   { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 3s ease-out forwards; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    .flow { stroke-dasharray: 7 5; animation: flow 1.2s linear infinite; }
    .pk   { animation: pk 2.4s linear infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pk { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(100px); opacity: 0; } }
  </style>
