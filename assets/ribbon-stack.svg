<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Engineering Stack</title>
  <desc id="d">Section ribbon: ENGINEERING STACK</desc>
  <defs>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#b98d58" stop-opacity="0"/>
      <stop offset="1" stop-color="#8b6a3a" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="stain" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9a6b35" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9a6b35" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .38  0 0 0 0 .27  0 0 0 0 .13  .32 0 0 0 0"/>
    </filter>
    <clipPath id="clip"><rect width="1000" height="44" rx="10"/></clipPath>
